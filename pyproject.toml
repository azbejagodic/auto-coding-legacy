[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-coding"
version = "0.1.0"
description = "Local workflow automation foundation for the auto-coding project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["groq>=1.7.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
auto-coding = "auto_coding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_coding = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

